version: '3.8'

services:
  # Ganache Blockchain Service - Using official image
  ganache:
    image: trufflesuite/ganache:latest
    container_name: iot-blockchain-ganache
    ports:
      - "8545:8545"
    environment:
      # Ganache environment setup
      - MNEMONIC=test test test test test test test test test test test junk
    command: >
      ganache
      --host 0.0.0.0
      --port 8545
      --deterministic
      --mnemonic "test test test test test test test test test test test junk"
      --accounts 10
      --chain-id 1337
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - iot-blockchain-network
    restart: unless-stopped

  # Python API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: iot-blockchain-api
    ports:
      - "5000:5000"
    depends_on:
      ganache:
        condition: service_healthy
    environment:
      # CRITICAL: Use service name, not localhost
      - GANACHE_URL=http://ganache:8545
      - NETWORK_ID=1337
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./results:/app/results
      - ./contract_info.json:/app/contract_info.json
      - ./contracts:/app/contracts
    networks:
      - iot-blockchain-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Frontend Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: iot-blockchain-frontend
    ports:
      - "8000:8000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./frontend:/app
    networks:
      - iot-blockchain-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  ganache_data:
    driver: local

networks:
  iot-blockchain-network:
    driver: bridge