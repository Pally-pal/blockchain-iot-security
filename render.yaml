services:
  - type: worker
    name: iot-blockchain-ganache
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile.ganache
    dockerContext: ./
    region: ohio
    autoDeploy: true
    envVars:
      - key: GANACHE_HOST
        value: 0.0.0.0
      - key: GANACHE_PORT
        value: "8545"
      - key: PORT
        value: "8545"

  - type: web
    name: iot-blockchain-api
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile.api
    dockerContext: ./
    healthCheckPath: /api/health
    region: ohio
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5000"
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: src/api_server_complete.py
      - key: BLOCKCHAIN_RPC_URL
        value: http://iot-blockchain-ganache:8545
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: iot-blockchain-frontend
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: ./
    healthCheckPath: /
    region: ohio
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: API_URL
        fromService:
          name: iot-blockchain-api
          type: web
          property: hostport
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: iot-blockchain-postgres
    databaseName: iot_blockchain_db
    user: iot_user
    region: ohio
    plan: free